name: Go Changelog Generator
description: Generate changelogs from Conventional Commits using Go
author: somaz94

branding:
  icon: file-text
  color: blue

inputs:
  output_file:
    description: 'Output file path for the changelog'
    required: false
    default: 'CHANGELOG.md'
  tag_pattern:
    description: 'Regex pattern to match version tags'
    required: false
    default: 'v[0-9]*.[0-9]*.[0-9]*'
  exclude_types:
    description: 'Comma-separated list of commit types to exclude (e.g., "chore,style")'
    required: false
    default: ''
  include_breaking:
    description: 'Include BREAKING CHANGE section'
    required: false
    default: 'true'
  date_format:
    description: 'Date format for changelog entries (Go time format)'
    required: false
    default: '2006-01-02'
  header:
    description: 'Custom header for the changelog file'
    required: false
    default: '# Changelog'
  unreleased:
    description: 'Include unreleased changes section'
    required: false
    default: 'true'
  unreleased_title:
    description: 'Title for unreleased changes section'
    required: false
    default: 'Unreleased'
  skip_commits:
    description: 'Regex pattern to skip matching commit messages'
    required: false
    default: '^Merge'
  repository_url:
    description: 'Repository URL for commit/compare links (auto-detected if not set)'
    required: false
    default: ''
  dry_run:
    description: 'Preview changelog without writing to file'
    required: false
    default: 'false'
  include_non_conventional:
    description: 'Include non-conventional commits in "Other Changes" section'
    required: false
    default: 'false'
  since_tag:
    description: 'Generate changelog starting from this tag (inclusive)'
    required: false
    default: ''
  until_tag:
    description: 'Generate changelog up to this tag (inclusive)'
    required: false
    default: ''
  custom_type_mapping:
    description: 'JSON object mapping commit types to custom section names (e.g., {"feat": "New Features", "fix": "Bugfixes"})'
    required: false
    default: ''

outputs:
  changelog_file:
    description: 'Path to the generated changelog file'
  changelog_content:
    description: 'Generated changelog content'
  entries_count:
    description: 'Number of changelog entries generated'
  latest_version:
    description: 'Latest version tag found'

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
    INPUT_TAG_PATTERN: ${{ inputs.tag_pattern }}
    INPUT_EXCLUDE_TYPES: ${{ inputs.exclude_types }}
    INPUT_INCLUDE_BREAKING: ${{ inputs.include_breaking }}
    INPUT_DATE_FORMAT: ${{ inputs.date_format }}
    INPUT_HEADER: ${{ inputs.header }}
    INPUT_UNRELEASED: ${{ inputs.unreleased }}
    INPUT_UNRELEASED_TITLE: ${{ inputs.unreleased_title }}
    INPUT_SKIP_COMMITS: ${{ inputs.skip_commits }}
    INPUT_REPOSITORY_URL: ${{ inputs.repository_url }}
    INPUT_DRY_RUN: ${{ inputs.dry_run }}
    INPUT_INCLUDE_NON_CONVENTIONAL: ${{ inputs.include_non_conventional }}
    INPUT_SINCE_TAG: ${{ inputs.since_tag }}
    INPUT_UNTIL_TAG: ${{ inputs.until_tag }}
    INPUT_CUSTOM_TYPE_MAPPING: ${{ inputs.custom_type_mapping }}
