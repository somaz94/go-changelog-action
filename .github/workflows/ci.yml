name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci-prelude:
    name: Unit Tests + Docker Build
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5001:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Go unit tests + Docker build and push to local registry
        id: ci
        uses: somaz94/go-docker-action-ci-action@v1
        with:
          coverage_threshold: '90'
          manage_registry: 'false'

      - name: Run the Container (dry-run)
        run: |
          docker run \
            --env INPUT_OUTPUT_FILE="CHANGELOG.md" \
            --env INPUT_TAG_PATTERN="v[0-9]*.[0-9]*.[0-9]*" \
            --env INPUT_DRY_RUN="true" \
            --env INPUT_EXCLUDE_AUTHORS="GitHub Action,GitHub Actions,dependabot[bot],renovate[bot],github-actions[bot]" \
            --volume ${{ github.workspace }}:/app \
            --rm "${{ steps.ci.outputs.image_ref }}"

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    needs: ci-prelude

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test Local Action (dry-run)
        id: test-action
        uses: ./
        with:
          output_file: CHANGELOG.md
          dry_run: true

      - name: Verify Output
        run: |
          cat <<'EOF'
          changelog_file=${{ steps.test-action.outputs.changelog_file }}
          entries_count=${{ steps.test-action.outputs.entries_count }}
          latest_version=${{ steps.test-action.outputs.latest_version }}
          EOF
          if [ -z "${{ steps.test-action.outputs.changelog_file }}" ]; then
            echo "FAIL: changelog_file output is empty"
            exit 1
          fi
          echo "PASS: action outputs verified"

  ci-result:
    name: CI Result
    if: always()
    needs:
      - ci-prelude
      - test-action
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "[FAIL]Some jobs failed or were cancelled"
            exit 1
          fi
          echo "[PASS]All CI jobs passed"
