name: Smoke Test (Released Action)

on:
  workflow_dispatch:
    inputs:
      run:
        description: 'workflow run'
        required: true
        default: 'true'
  workflow_run:
    workflows: ["Create release"]
    types:
      - completed

permissions:
  contents: write

jobs:
  smoke-test-dry-run:
    name: Smoke Test (Dry Run)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog (dry-run)
        id: changelog-dry-run
        uses: somaz94/go-changelog-action@v1
        with:
          output_file: CHANGELOG.md
          dry_run: true

      - name: Verify Dry Run Output
        run: |
          echo "changelog_file=${{ steps.changelog-dry-run.outputs.changelog_file }}"
          echo "entries_count=${{ steps.changelog-dry-run.outputs.entries_count }}"
          echo "latest_version=${{ steps.changelog-dry-run.outputs.latest_version }}"
          echo "PASS: dry-run completed successfully"

  smoke-test-generate:
    name: Smoke Test (Generate)
    runs-on: ubuntu-latest
    needs: [smoke-test-dry-run]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        uses: somaz94/go-changelog-action@v1
        with:
          output_file: CHANGELOG-TEST.md
          exclude_types: 'style'
          unreleased: true

      - name: Verify Generated File
        run: |
          if [ -f "CHANGELOG-TEST.md" ]; then
            echo "PASS: CHANGELOG-TEST.md generated"
            head -20 CHANGELOG-TEST.md
          else
            echo "FAIL: CHANGELOG-TEST.md not found"
            exit 1
          fi

      - name: Verify Outputs
        run: |
          echo "changelog_file=${{ steps.changelog.outputs.changelog_file }}"
          echo "entries_count=${{ steps.changelog.outputs.entries_count }}"
          echo "latest_version=${{ steps.changelog.outputs.latest_version }}"

  smoke-test-custom-options:
    name: Smoke Test (Custom Options)
    runs-on: ubuntu-latest
    needs: [smoke-test-generate]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog with Custom Options
        id: changelog-custom
        uses: somaz94/go-changelog-action@v1
        with:
          output_file: CHANGELOG-CUSTOM.md
          exclude_types: 'chore,style,ci'
          include_breaking: true
          date_format: '2006-01-02'
          header: '# Release Notes'
          unreleased: false
          skip_commits: '^Merge'

      - name: Verify Custom Header
        run: |
          if head -1 CHANGELOG-CUSTOM.md | grep -q "# Release Notes"; then
            echo "PASS: custom header applied"
          else
            echo "FAIL: custom header not found"
            head -5 CHANGELOG-CUSTOM.md
            exit 1
          fi

  smoke-test-exclude-authors:
    name: Smoke Test (Exclude Authors)
    runs-on: ubuntu-latest
    needs: [smoke-test-custom-options]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate with default exclude_authors
        uses: somaz94/go-changelog-action@v1
        with:
          output_file: CHANGELOG-EXCLUDE.md

      - name: Verify bots are excluded from Contributors
        run: |
          if grep -q "dependabot\[bot\]" CHANGELOG-EXCLUDE.md; then
            echo "FAIL: dependabot[bot] should be excluded"
            exit 1
          fi
          if grep -q "^- GitHub Action$" CHANGELOG-EXCLUDE.md; then
            echo "FAIL: GitHub Action should be excluded"
            exit 1
          fi
          if grep -q "^- GitHub Actions$" CHANGELOG-EXCLUDE.md; then
            echo "FAIL: GitHub Actions should be excluded"
            exit 1
          fi
          echo "PASS: bot authors excluded from Contributors"

  smoke-test-advanced-options:
    name: Smoke Test (Advanced Options)
    runs-on: ubuntu-latest
    needs: [smoke-test-exclude-authors]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate with custom_type_mapping and include_non_conventional
        id: changelog-advanced
        uses: somaz94/go-changelog-action@v1
        with:
          output_file: CHANGELOG-ADVANCED.md
          include_non_conventional: true
          custom_type_mapping: '{"feat": "New Features", "fix": "Bugfixes"}'

      - name: Verify Advanced Output
        run: |
          if [ ! -f "CHANGELOG-ADVANCED.md" ]; then
            echo "FAIL: CHANGELOG-ADVANCED.md not found"
            exit 1
          fi
          echo "PASS: advanced options completed"
          head -30 CHANGELOG-ADVANCED.md

  smoke-test-tag-range:
    name: Smoke Test (Tag Range)
    runs-on: ubuntu-latest
    needs: [smoke-test-custom-options]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate with since_tag and repository_url
        id: changelog-range
        uses: somaz94/go-changelog-action@v1
        with:
          output_file: CHANGELOG-RANGE.md
          since_tag: 'v1.0.0'
          repository_url: 'https://github.com/somaz94/go-changelog-action'
          dry_run: true

      - name: Verify Tag Range Output
        run: |
          cat <<'EOF'
          changelog_file=${{ steps.changelog-range.outputs.changelog_file }}
          entries_count=${{ steps.changelog-range.outputs.entries_count }}
          latest_version=${{ steps.changelog-range.outputs.latest_version }}
          EOF
          echo "PASS: tag range test completed"
